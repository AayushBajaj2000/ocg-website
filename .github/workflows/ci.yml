name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json#packageManager — nothing to drift here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build validates its env and prerenders Sanity content. `.env.example` holds safe
      # values for both: Cloudflare's always-pass Turnstile pair and the public, read-only dataset.
      - run: cp .env.example .env.local

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec oxlint
      # Next generates global route types (LayoutProps, PageProps) into .next/types;
      # a fresh CI checkout has none until `next typegen` runs.
      - run: pnpm typecheck
      - run: pnpm build
